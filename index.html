<script type="text/babel">
const {useState,useMemo,useEffect}=React;
const P={search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',file:'<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/>',calc:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>',pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',box:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>',pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',check:'<path d="M20 6 9 17l-5-5"/>',plus:'<path d="M5 12h14M12 5v14"/>',filter:'<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>'};
const I=({n,s=20,c=''})=><svg className={c} width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" dangerouslySetInnerHTML={{__html:P[n]}}/>;
const Logo=({size='text-3xl'})=><span className={`font-display ${size} tracking-tight leading-none`} aria-label="relevo">re<span className="text-guinda font-medium">l</span>evo</span>;

const CATS=[{id:'Libros',icon:'book',label:'Libros y textos',tone:'#E4E0D8'},{id:'Maquetas',icon:'box',label:'Arquitectura y maquetas',tone:'#DDE2E0'},{id:'Calculadoras',icon:'calc',label:'Ingeniería y calculadoras',tone:'#E2DADC'},{id:'Útiles',icon:'pen',label:'Útiles e indumentaria',tone:'#E6E3DA'},{id:'Apuntes PDF',icon:'file',label:'Apuntes digitales PDF',tone:'#DCDFE3'}];
const UNIS0=['UPC','PUCP','U de Lima','UTP'];
const CARR0=['Arquitectura','Ingeniería Civil','Ingeniería Industrial','Administración','Derecho','Medicina'];
const CURS0=['Cálculo 1','Estática','Física 2','Contabilidad General','Administración de Operaciones'];
const PTS=[['Biblioteca','Mostrador de atención, piso 1'],['Cafetería','Zona de mesas junto a la entrada'],['Pabellón','Hall principal, frente a seguridad']];
const TS=()=>firebase.firestore.FieldValue.serverTimestamp();
const isInst=e=>/\.edu(\.[a-z]{2})?$/i.test((e||'').split('@')[1]||'');
const norm=s=>(s||'').trim().replace(/\s+/g,' ');
const uniq=(a,b)=>[...new Set([...a,...b.filter(Boolean)])].sort((x,y)=>x.localeCompare(y));
const shrink=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};im.src=r.result};r.readAsDataURL(f)});

const Photo=({p,big})=>{const c=CATS.find(x=>x.id===p.cat)||CATS[0];return <div className={`relative flex items-center justify-center ${big?'h-56':'h-40'} rounded-xl overflow-hidden`} style={{background:c.tone}}>{p.photo?<img src={p.photo} alt="" className="absolute inset-0 w-full h-full object-cover"/>:<I n={c.icon} s={big?64:44} c="text-ink/50"/>}<span className="absolute left-3 bottom-3 text-xs bg-white/90 rounded-full px-2 py-0.5">{p.cond}</span></div>};
const Badge=({inst})=><span className="inline-flex items-center gap-1 text-sm text-ink/70"><I n="shield" s={15} c="text-guinda"/>{inst?'Correo institucional':'Cuenta de Google'}</span>;
const Card=({p,open,ventas})=><button onClick={()=>open(p)} className="text-left bg-white border border-linea rounded-2xl p-3 hover:border-guinda transition-colors w-full">
<Photo p={p}/><div className="pt-3 px-1 pb-1"><h3 className="font-medium leading-snug min-h-[2.75rem]">{p.title}</h3>
<span className="font-display text-2xl block mt-2">S/ {p.price}</span>
<p className="text-sm text-ink/60 mt-1">{p.uni} · {p.carrera}</p><p className="text-sm text-ink/60">{p.ownerName} · {ventas(p.ownerId)} ventas</p>{p._pending&&<p className="text-xs text-guinda mt-1">Guardando en la base de datos…</p>}</div></button>;
const Empty=({t,d,b,f})=><div className="bg-white border border-linea rounded-2xl p-10 text-center"><p className="font-display text-2xl mb-1">{t}</p><p className="text-ink/60 mb-4">{d}</p>{b&&<button onClick={f} className="bg-guinda text-white rounded-full px-5 py-2">{b}</button>}</div>;

function App(){
const [view,setView]=useState('home');const [items,setItems]=useState([]);const [dbErr,setDbErr]=useState('');
const [user,setUser]=useState(null);const [profile,setProfile]=useState({});const [orders,setOrders]=useState([]);const [profId,setProfId]=useState('');
const [q,setQ]=useState('');const [unis,setUnis]=useState([]);const [car,setCar]=useState('');const [cat,setCat]=useState('');const [max,setMax]=useState(500);const [fOpen,setFOpen]=useState(false);
const [sel,setSel]=useState(null);const [co,setCo]=useState(null);const [toast,setToast]=useState('');const [heroQ,setHeroQ]=useState('');
const shout=m=>{setToast(m);setTimeout(()=>setToast(''),3000)};
const go=v=>{setView(v);setFOpen(false);window.scrollTo(0,0)};
useEffect(()=>db.collection('products').orderBy('createdAt','desc').onSnapshot({includeMetadataChanges:true},s=>{setItems(s.docs.map(d=>({id:d.id,_pending:d.metadata.hasPendingWrites,...d.data()})))},e=>setDbErr(e.code||'error')),[]);
useEffect(()=>{let ok=false;const t=setTimeout(()=>{if(!ok)setDbErr('timeout')},8000);db.collection('products').limit(1).get({source:'server'}).then(()=>{ok=true;clearTimeout(t);setDbErr('')}).catch(e=>{ok=true;clearTimeout(t);setDbErr(e.code||'error')});return()=>clearTimeout(t)},[]);
useEffect(()=>firebase.auth().onAuthStateChanged(u=>{if(!u){setUser(null);setProfile({});return}
setUser({uid:u.uid,name:u.displayName||'Estudiante',photo:u.photoURL,inst:isInst(u.email)});
const ref=db.collection('users').doc(u.uid);ref.get().then(d=>{if(!d.exists)ref.set({name:u.displayName||'Estudiante',photo:u.photoURL||'',inst:isInst(u.email)})});ref.onSnapshot(d=>setProfile(d.data()||{}))}),[]);
useEffect(()=>{if(!user){setOrders([]);return}const a={};const push=s=>{s.docs.forEach(d=>a[d.id]={id:d.id,...d.data()});setOrders(Object.values(a).sort((x,y)=>((y.createdAt||{}).seconds||9e9)-((x.createdAt||{}).seconds||9e9)))};
const l1=db.collection('orders').where('buyerId','==',user.uid).onSnapshot(push,()=>{});const l2=db.collection('orders').where('sellerId','==',user.uid).onSnapshot(push,()=>{});return()=>{l1();l2()}},[user&&user.uid]);
const login=async()=>{try{await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){shout('No se pudo iniciar sesión. Intenta de nuevo')}};
const me=user&&{...user,name:profile.name||user.name,inst:profile.inst!==undefined?profile.inst:user.inst};
const ventas=id=>items.filter(p=>p.ownerId===id&&p.status==='vendido').length;
const active=items.filter(p=>p.status!=='vendido'&&p.status!=='reservado');
const L={unis:uniq(UNIS0,items.map(p=>p.uni)),carr:uniq(CARR0,items.map(p=>p.carrera)),curs:uniq(CURS0,items.map(p=>p.course))};
const list=useMemo(()=>{const t=q.trim().toLowerCase();return active.filter(p=>(!t||[p.title,p.course,p.carrera,p.cat,p.uni,p.desc].join(' ').toLowerCase().includes(t))&&(!unis.length||unis.includes(p.uni))&&(!car||p.carrera===car)&&(!cat||p.cat===cat)&&p.price<=max)},[items,q,unis,car,cat,max]);
const clear=()=>{setQ('');setUnis([]);setCar('');setCat('');setMax(500)};
const openProf=id=>{setSel(null);setCo(null);setProfId(id);go('profile')};
const pend=orders.filter(o=>o.status==='pendiente').length;
const nav=[['home','Inicio'],['explore','Explorar'],['sell','Vender'],...(user?[['orders','Pedidos'+(pend?` (${pend})`:'')]]:[])];

return <div className="min-h-screen">
<header className="sticky top-0 z-30 bg-bruma/90 backdrop-blur border-b border-linea"><div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
<button onClick={()=>go('home')} aria-label="Ir al inicio"><Logo/></button>
<nav className="flex items-center gap-1 order-3 sm:order-2 w-full sm:w-auto overflow-x-auto">{nav.map(([k,l])=><button key={k} onClick={()=>go(k)} className={`px-3 py-2 rounded-full text-sm whitespace-nowrap ${view===k?'bg-ink text-white':'hover:bg-white'}`}>{l}</button>)}</nav>
<div className="flex items-center gap-2 text-sm order-2 sm:order-3">{user?<><button onClick={()=>openProf(user.uid)} className="flex items-center gap-2 rounded-full hover:bg-white pr-3" aria-label="Mi perfil">{user.photo?<img src={user.photo} alt="" referrerPolicy="no-referrer" className="w-9 h-9 rounded-full"/>:<span className="w-9 h-9 rounded-full bg-guinda text-white flex items-center justify-center"><I n="user" s={18}/></span>}<span className="hidden sm:inline max-w-[8rem] truncate">{me.name.split(' ')[0]}</span></button><button onClick={()=>{firebase.auth().signOut();go('home')}} className="px-3 py-2 rounded-full border border-linea hover:bg-white">Salir</button></>:<button onClick={login} className="px-4 py-2 rounded-full bg-guinda text-white flex items-center gap-2"><I n="user" s={16}/>Ingresar</button>}</div></div></header>

{dbErr&&<div role="alert" className="bg-guinda text-white text-sm text-center px-4 py-2">{dbErr==='permission-denied'?'Las reglas de Firestore no permiten leer ni guardar. Pega y publica las reglas en Firebase → Firestore → Reglas.':dbErr==='timeout'||dbErr==='unavailable'||dbErr==='not-found'?'No hay conexión con la base de datos. Crea Firestore en Firebase (Firestore Database → Crear base de datos) y recarga. Mientras tanto, lo que publiques NO se guarda.':'No se pudo conectar con la base de datos ('+dbErr+').'}</div>}

{view==='home'&&<main>
<section className="max-w-6xl mx-auto px-4 pt-14 pb-12 grid lg:grid-cols-5 gap-10 items-center">
<div className="lg:col-span-3"><h1 className="font-display text-5xl md:text-7xl leading-[1.02] tracking-tight">Lo que ya usaste, <br/>le sirve a quien sigue.</h1>
<p className="mt-5 text-lg text-ink/70 max-w-xl">Compra y vende libros, maquetas, calculadoras y apuntes con estudiantes de ciclos anteriores. Entrega en puntos seguros de tu campus.</p>
<form onSubmit={e=>{e.preventDefault();setQ(heroQ);go('explore')}} className="mt-7 flex gap-2 bg-white border border-linea rounded-full p-1.5 max-w-xl">
<label className="flex items-center gap-2 flex-1 pl-4"><I n="search" c="text-ink/50"/><input value={heroQ} onChange={e=>setHeroQ(e.target.value)} placeholder="Busca por curso, carrera o material" className="w-full bg-transparent outline-none py-2"/></label>
<button className="bg-guinda text-white rounded-full px-6 py-2.5 font-medium">Buscar</button></form></div>
<div className="lg:col-span-2 bg-white border border-linea rounded-3xl p-6 space-y-4">
{[['shield','Vendedores con perfil','Ves su universidad, carrera y ventas antes de coordinar.'],['pin','Entrega dentro del campus','Biblioteca, cafetería o pabellón: lugares con gente y seguridad.'],['lock','Código de entrega','El pago y la entrega se cierran con un código que solo tiene el comprador.']].map(([i,t,d])=><div key={t} className="flex gap-3"><span className="w-10 h-10 shrink-0 rounded-full bg-bruma flex items-center justify-center text-guinda"><I n={i}/></span><div><p className="font-medium">{t}</p><p className="text-sm text-ink/60">{d}</p></div></div>)}</div></section>
<section className="max-w-6xl mx-auto px-4 py-8"><h2 className="font-display text-3xl mb-5">Categorías</h2>
<div className="grid grid-cols-2 md:grid-cols-5 gap-3">{CATS.map(c=><button key={c.id} onClick={()=>{clear();setCat(c.id);go('explore')}} className="bg-white border border-linea rounded-2xl p-4 text-left hover:border-guinda"><span className="w-11 h-11 rounded-xl flex items-center justify-center mb-6" style={{background:c.tone}}><I n={c.icon}/></span><span className="text-sm font-medium">{c.label}</span></button>)}</div></section>
<section className="max-w-6xl mx-auto px-4 py-8 pb-16"><div className="flex items-end justify-between mb-5"><h2 className="font-display text-3xl">Recién publicados en tu campus</h2><button onClick={()=>{clear();go('explore')}} className="text-sm text-guinda underline underline-offset-4">Ver todo</button></div>
{active.length?<div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{active.slice(0,6).map(p=><Card key={p.id} p={p} open={setSel} ventas={ventas}/>)}</div>:<Empty t="Aún no hay publicaciones" d="Sé la primera persona en publicar un material en Relevo." b="Publicar un material" f={()=>go('sell')}/>}</section></main>}

{view==='explore'&&<main className="max-w-6xl mx-auto px-4 py-8">
<h1 className="font-display text-4xl mb-5">Explorar materiales</h1>
<div className="flex gap-2 mb-6"><label className="flex items-center gap-2 flex-1 bg-white border border-linea rounded-full px-4"><I n="search" c="text-ink/50"/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Busca por curso, carrera o material" className="w-full bg-transparent outline-none py-3"/></label>
<button onClick={()=>setFOpen(!fOpen)} className="lg:hidden flex items-center gap-2 px-4 rounded-full border border-linea bg-white"><I n="filter" s={16}/>Filtros</button></div>
<div className="grid lg:grid-cols-4 gap-6">
<aside className={`${fOpen?'block':'hidden'} lg:block bg-white border border-linea rounded-2xl p-5 h-fit space-y-6`}>
<fieldset><legend className="font-medium mb-2">Universidad</legend>{L.unis.map(u=><label key={u} className="flex items-center gap-2 py-1 text-sm"><input type="checkbox" className="accent-[#6B1A2F]" checked={unis.includes(u)} onChange={()=>setUnis(unis.includes(u)?unis.filter(x=>x!==u):[...unis,u])}/>{u}</label>)}</fieldset>
<label className="block"><span className="font-medium block mb-2">Carrera</span><select value={car} onChange={e=>setCar(e.target.value)} className="w-full border border-linea rounded-xl p-2 text-sm bg-white"><option value="">Todas</option>{L.carr.map(c=><option key={c}>{c}</option>)}</select></label>
<label className="block"><span className="font-medium block mb-2">Tipo de material</span><select value={cat} onChange={e=>setCat(e.target.value)} className="w-full border border-linea rounded-xl p-2 text-sm bg-white"><option value="">Todos</option>{CATS.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}</select></label>
<label className="block"><span className="font-medium flex justify-between mb-2">Precio máximo<span className="font-normal">S/ {max}</span></span><input type="range" min="10" max="500" step="10" value={max} onChange={e=>setMax(+e.target.value)} className="w-full accent-[#6B1A2F]"/></label>
<button onClick={clear} className="text-sm text-guinda underline underline-offset-4">Quitar filtros</button></aside>
<section className="lg:col-span-3"><p className="text-sm text-ink/60 mb-3">{list.length} {list.length===1?'resultado':'resultados'}</p>
{list.length?<div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">{list.map(p=><Card key={p.id} p={p} open={setSel} ventas={ventas}/>)}</div>:<Empty t="No hay materiales con esos filtros" d="Prueba con otro curso o quita algún filtro." b="Quitar filtros" f={clear}/>}</section></div></main>}

{view==='sell'&&(!user?<Gate login={login} t="Únete a Relevo" d="Ingresa con tu cuenta de Google para publicar materiales."/>:<Sell me={me} profile={profile} L={L} items={items} ventas={ventas} open={setSel} go={go} shout={shout}/>)}
{view==='orders'&&(!user?<Gate login={login} t="Tus pedidos" d="Ingresa para ver tus compras y ventas."/>:<Orders me={me} orders={orders} shout={shout} go={go}/>)}
{view==='profile'&&(!user&&profId===''?<Gate login={login} t="Tu perfil" d="Ingresa para ver tu perfil."/>:<Profile key={profId} uid={profId} me={me} profile={profile} items={items} ventas={ventas} open={setSel} go={go} shout={shout}/>)}

<footer className="border-t border-linea py-8 text-center text-sm text-ink/60"><Logo size="text-2xl"/><p className="mt-2">Relevo · Prototipo universitario</p></footer>

{sel&&!co&&<Modal close={()=>setSel(null)} title="Detalle del material"><Photo p={sel} big/>
<h2 className="font-display text-3xl mt-4 leading-tight">{sel.title}</h2>
<p className="font-display text-3xl text-guinda mt-1">S/ {sel.price}</p>
{sel.desc&&<p className="text-ink/70 mt-2">{sel.desc}</p>}
<dl className="grid grid-cols-2 gap-3 text-sm mt-4">{[['Estado real',sel.cond],['Curso',sel.course],['Ciclo',sel.ciclo],['Universidad',sel.uni],['Carrera',sel.carrera],['Tipo',sel.cat]].map(([k,v])=><div key={k} className="bg-bruma rounded-xl p-3"><dt className="text-ink/60">{k}</dt><dd className="font-medium">{v}</dd></div>)}</dl>
<button onClick={()=>openProf(sel.ownerId)} className="w-full text-left border border-linea rounded-2xl p-4 mt-4 flex items-center gap-3 hover:border-guinda"><span className="w-11 h-11 rounded-full bg-guinda text-white flex items-center justify-center"><I n="user"/></span><span className="flex-1"><span className="font-medium block">{sel.ownerName}</span><Badge inst={sel.ownerInst}/></span><span className="text-sm text-right"><b>{ventas(sel.ownerId)}</b> ventas<br/><span className="text-guinda underline underline-offset-4">Ver perfil</span></span></button>
{user&&sel.ownerId===user.uid?<p className="mt-5 text-center text-ink/60">Esta es tu publicación.</p>:(sel.status==='vendido'||sel.status==='reservado')?<p className="mt-5 text-center text-ink/60">{sel.status==='vendido'?'Este material ya fue vendido.':'Este material ya fue reservado por otra persona.'}</p>:<button onClick={()=>user?setCo({step:1,pt:'',m:'',h:''}):login()} className="w-full mt-5 bg-guinda text-white rounded-full py-3 font-medium flex items-center justify-center gap-2"><I n={user?'pin':'lock'} s={18}/>{user?'Coordinar en campus':'Ingresa para coordinar'}</button>}</Modal>}

{sel&&co&&<Checkout sel={sel} co={co} setCo={setCo} me={me} close={()=>{setCo(null);setSel(null)}} go={go} shout={shout}/>}
{toast&&<div role="status" className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-ink text-white rounded-full px-5 py-3 text-sm z-50 flex items-center gap-2"><I n="check" s={16}/>{toast}</div>}
</div>}

function Modal({title,close,children}){return <div className="fixed inset-0 z-40 bg-ink/50 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={close}><div role="dialog" aria-modal="true" aria-label={title} onClick={e=>e.stopPropagation()} className="bg-white w-full sm:max-w-lg max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5"><div className="flex justify-between items-center mb-3"><span className="text-sm text-ink/60">{title}</span><button onClick={close} aria-label="Cerrar" className="w-9 h-9 rounded-full hover:bg-bruma flex items-center justify-center"><I n="x"/></button></div>{children}</div></div>}
function Gate({login,t,d}){return <main className="max-w-md mx-auto px-4 py-20 text-center"><span className="w-14 h-14 mx-auto rounded-full bg-guinda text-white flex items-center justify-center"><I n="lock" s={26}/></span><h1 className="font-display text-4xl mt-5">{t}</h1><p className="text-ink/70 mt-2">{d}</p><button onClick={login} className="mt-6 bg-guinda text-white rounded-full px-6 py-3 font-medium">Continuar con Google</button></main>}

function Checkout({sel,co,setCo,me,close,go,shout}){
const [busy,setBusy]=useState(false);
const confirm=async()=>{setBusy(true);const code='RLV-'+Math.floor(1000+Math.random()*9000);
try{await db.runTransaction(async tx=>{const pr=db.collection('products').doc(sel.id);const ps=await tx.get(pr);if(!ps.exists||ps.data().status!=='activo')throw new Error('taken');
tx.update(pr,{status:'reservado'});tx.set(db.collection('orders').doc(),{productId:sel.id,title:sel.title,price:sel.price,uni:sel.uni,sellerId:sel.ownerId,sellerName:sel.ownerName,buyerId:me.uid,buyerName:me.name,point:co.pt,method:co.m,hour:co.h,code,status:'pendiente',createdAt:TS()})});setCo({...co,step:2,code})}
catch(e){if(e.message==='taken'){shout('Otra persona ya reservó este material');close()}else shout('No se pudo crear el pedido. Intenta de nuevo')}setBusy(false)};
return <Modal close={close} title="Coordinar en campus">
{co.step===1?<div className="space-y-5">
<p className="text-sm text-ink/70">{sel.title} · <b>S/ {sel.price}</b> · {sel.ownerName}</p>
<div><p className="font-medium mb-2">Punto de encuentro en {sel.uni}</p><div className="space-y-2">{PTS.map(([n,d])=><button key={n} onClick={()=>setCo({...co,pt:n})} className={`w-full text-left border rounded-xl p-3 flex items-center gap-3 ${co.pt===n?'border-guinda bg-guinda/5':'border-linea'}`}><I n="pin" c="text-guinda"/><span><span className="font-medium block">{n}</span><span className="text-sm text-ink/60">{d}</span></span></button>)}</div></div>
<div><p className="font-medium mb-2">Forma de pago</p><div className="grid grid-cols-2 gap-2">{['Pago contra entrega','Transferencia directa'].map(m=><button key={m} onClick={()=>setCo({...co,m})} className={`border rounded-xl p-3 text-sm ${co.m===m?'border-guinda bg-guinda/5':'border-linea'}`}>{m}</button>)}</div></div>
<label className="block"><span className="font-medium block mb-2">Horario</span><select value={co.h} onChange={e=>setCo({...co,h:e.target.value})} className="w-full border border-linea rounded-xl p-3 bg-white"><option value="">Elige un horario</option>{['10:00 a. m.','1:00 p. m.','4:00 p. m.'].map(h=><option key={h}>{h}</option>)}</select></label>
<button disabled={!co.pt||!co.m||!co.h||busy} onClick={confirm} className="w-full bg-guinda text-white rounded-full py-3 font-medium disabled:opacity-40 flex items-center justify-center gap-2"><I n="lock" s={18}/>{busy?'Confirmando...':'Confirmar encuentro'}</button></div>
:<div className="text-center py-4"><span className="w-14 h-14 mx-auto rounded-full bg-guinda text-white flex items-center justify-center"><I n="check" s={28}/></span>
<h2 className="font-display text-3xl mt-4">Encuentro confirmado</h2>
<p className="text-ink/70 mt-2">{co.pt} de {sel.uni}, a las {co.h}. {co.m==='Pago contra entrega'?'Pagas al recibir el material.':'Transfieres cuando estén juntos y revises el material.'}</p>
<div className="bg-bruma rounded-2xl p-4 mt-5"><p className="text-sm text-ink/60">Tu código de entrega</p><p className="font-display text-4xl tracking-widest">{co.code}</p><p className="text-sm text-ink/60 mt-1">Dáselo a {sel.ownerName} solo cuando tengas el material en la mano.</p></div>
<button onClick={()=>{close();go('orders')}} className="mt-5 bg-guinda text-white rounded-full px-6 py-2.5">Ver mis pedidos</button></div>}</Modal>}

function Orders({me,orders,shout}){
const [codes,setCodes]=useState({});
const buys=orders.filter(o=>o.buyerId===me.uid),sells=orders.filter(o=>o.sellerId===me.uid);
const chip=s=><span className={`text-xs rounded-full px-2 py-0.5 border ${s==='completado'?'bg-guinda text-white border-guinda':s==='cancelado'?'text-ink/50 border-linea':'border-guinda text-guinda'}`}>{s}</span>;
const cancel=async o=>{try{const b=db.batch();b.update(db.collection('orders').doc(o.id),{status:'cancelado'});b.update(db.collection('products').doc(o.productId),{status:'activo'});await b.commit();shout('Pedido cancelado: el material vuelve a estar disponible')}catch(e){try{await db.collection('orders').doc(o.id).update({status:'cancelado'});shout('Pedido cancelado')}catch(x){shout('No se pudo cancelar')}}};
const done=async o=>{if((codes[o.id]||'').trim().toUpperCase()!==o.code){shout('El código no coincide. Pídelo de nuevo al comprador');return}
try{const b=db.batch();b.update(db.collection('orders').doc(o.id),{status:'completado'});b.update(db.collection('products').doc(o.productId),{status:'vendido'});await b.commit();shout('Entrega confirmada')}catch(e){shout('No se pudo confirmar la entrega')}};
return <main className="max-w-4xl mx-auto px-4 py-8 space-y-10">
<section><h1 className="font-display text-4xl mb-4">Mis compras</h1>
{buys.length?<div className="space-y-3">{buys.map(o=><div key={o.id} className="bg-white border border-linea rounded-2xl p-5"><div className="flex justify-between gap-3"><div><p className="font-medium">{o.title}</p><p className="text-sm text-ink/60">Vendedor: {o.sellerName} · S/ {o.price}</p></div>{chip(o.status)}</div>
<p className="text-sm mt-3 flex items-center gap-1"><I n="pin" s={15} c="text-guinda"/>{o.point} de {o.uni}, {o.hour} · {o.method}</p>
{o.status==='pendiente'&&<div className="mt-3 bg-bruma rounded-xl p-3 flex items-center justify-between gap-3 flex-wrap"><div><p className="text-xs text-ink/60">Código de entrega (solo tú lo ves)</p><p className="font-display text-3xl tracking-widest">{o.code}</p></div><button onClick={()=>cancel(o)} className="text-sm border border-linea rounded-full px-4 py-2 hover:bg-white">Cancelar pedido</button></div>}</div>)}</div>:<Empty t="Aún no compras nada" d="Cuando coordines una entrega, aparecerá aquí con tu código."/>}</section>
<section><h2 className="font-display text-4xl mb-4">Mis ventas</h2>
{sells.length?<div className="space-y-3">{sells.map(o=><div key={o.id} className="bg-white border border-linea rounded-2xl p-5"><div className="flex justify-between gap-3"><div><p className="font-medium">{o.title}</p><p className="text-sm text-ink/60">Comprador: {o.buyerName} · S/ {o.price}</p></div>{chip(o.status)}</div>
<p className="text-sm mt-3 flex items-center gap-1"><I n="pin" s={15} c="text-guinda"/>{o.point} de {o.uni}, {o.hour} · {o.method}</p>
{o.status==='pendiente'&&<div className="mt-3 flex gap-2 flex-wrap"><input value={codes[o.id]||''} onChange={e=>setCodes({...codes,[o.id]:e.target.value})} placeholder="Código del comprador" className="border border-linea rounded-xl px-3 py-2 flex-1 min-w-[10rem]"/><button onClick={()=>done(o)} className="bg-guinda text-white rounded-full px-5 py-2">Confirmar entrega</button><button onClick={()=>cancel(o)} className="border border-linea rounded-full px-5 py-2 hover:bg-bruma">Rechazar</button></div>}</div>)}</div>:<Empty t="Aún no tienes ventas" d="Cuando alguien coordine contigo, verás el pedido aquí."/>}</section></main>}

function Profile({uid,me,profile,items,ventas,open,go,shout}){
const own=!!me&&uid===me.uid;const [pu,setPu]=useState(null);const [f,setF]=useState({name:'',uni:'',carrera:'',ciclo:''});
useEffect(()=>{if(own){setF({name:profile.name||me.name,uni:profile.uni||'',carrera:profile.carrera||'',ciclo:profile.ciclo||''});return}db.collection('users').doc(uid).get().then(d=>setPu(d.exists?d.data():{name:'Estudiante'})).catch(()=>setPu({name:'Estudiante'}))},[uid]);
const d=own?{...f,photo:me.photo,inst:me.inst}:pu;
if(!d)return <main className="max-w-4xl mx-auto px-4 py-16 text-center text-ink/60">Cargando perfil...</main>;
const mine=items.filter(p=>p.ownerId===uid&&(own||(p.status!=='vendido'&&p.status!=='reservado')));
const save=async e=>{e.preventDefault();try{await db.collection('users').doc(uid).set({name:norm(f.name)||me.name,uni:norm(f.uni),carrera:norm(f.carrera),ciclo:norm(f.ciclo)},{merge:true});shout('Perfil guardado')}catch(x){shout('No se pudo guardar')}};
const del=p=>{if(window.confirm('¿Eliminar esta publicación?'))db.collection('products').doc(p.id).delete().catch(()=>shout('No se pudo eliminar'))};
const inp="w-full border border-linea rounded-xl p-3 bg-white";
return <main className="max-w-4xl mx-auto px-4 py-8">
<div className="bg-white border border-linea rounded-3xl p-6 flex items-center gap-4 flex-wrap">{d.photo?<img src={d.photo} alt="" referrerPolicy="no-referrer" className="w-20 h-20 rounded-full"/>:<span className="w-20 h-20 rounded-full bg-guinda text-white flex items-center justify-center"><I n="user" s={32}/></span>}
<div className="flex-1"><h1 className="font-display text-4xl">{own?(profile.name||me.name):d.name}</h1><p className="text-ink/70">{[d.uni,d.carrera,d.ciclo&&'Ciclo '+d.ciclo].filter(Boolean).join(' · ')||'Aún no completó su perfil'}</p><Badge inst={d.inst}/></div>
<div className="text-center"><p className="font-display text-4xl">{ventas(uid)}</p><p className="text-sm text-ink/60">ventas</p></div></div>
{own&&<form onSubmit={save} className="bg-white border border-linea rounded-3xl p-6 mt-6 grid sm:grid-cols-2 gap-4"><h2 className="sm:col-span-2 font-display text-2xl">Tus datos</h2>
<label><span className="font-medium block mb-1">Nombre</span><input value={f.name} onChange={e=>setF({...f,name:e.target.value})} className={inp}/></label>
<label><span className="font-medium block mb-1">Universidad</span><input value={f.uni} onChange={e=>setF({...f,uni:e.target.value})} placeholder="Escribe la tuya" className={inp}/></label>
<label><span className="font-medium block mb-1">Carrera</span><input value={f.carrera} onChange={e=>setF({...f,carrera:e.target.value})} className={inp}/></label>
<label><span className="font-medium block mb-1">Ciclo actual</span><input value={f.ciclo} onChange={e=>setF({...f,ciclo:e.target.value})} placeholder="Ej: VI" className={inp}/></label>
<button className="sm:col-span-2 bg-guinda text-white rounded-full py-3 font-medium">Guardar perfil</button></form>}
<h2 className="font-display text-3xl mt-10 mb-4">{own?'Tus publicaciones':'Publicaciones'}</h2>
{mine.length?<div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{mine.map(p=><div key={p.id}><Card p={p} open={open} ventas={ventas}/>{own&&<div className="flex items-center justify-between px-2 pt-1 text-sm"><span className="text-ink/60">{p.status==='vendido'?'Vendido':p.status==='reservado'?'Reservado':'Activo'}</span><button onClick={()=>del(p)} className="text-guinda underline underline-offset-4">Eliminar</button></div>}</div>)}</div>:<Empty t="Sin publicaciones" d={own?'Publica tu primer material en un minuto.':'Esta persona aún no publica nada.'} b={own&&'Publicar'} f={()=>go('sell')}/>}</main>}

function Sell({me,profile,L,items,ventas,open,go,shout}){
const empty={title:'',cat:'Libros',cond:'Bueno',price:'',course:'',ciclo:'I',uni:profile.uni||'',carrera:profile.carrera||'',desc:'',photo:''};
const [f,setF]=useState(empty);const [err,setErr]=useState('');const [busy,setBusy]=useState(false);
useEffect(()=>setF(x=>({...x,uni:x.uni||profile.uni||'',carrera:x.carrera||profile.carrera||''})),[profile.uni,profile.carrera]);
const sug={Libros:60,Maquetas:50,Calculadoras:60,Útiles:30,'Apuntes PDF':12};const base=Math.round(sug[f.cat]*({Excelente:1,Bueno:.8,Desgastado:.55}[f.cond]));
const set=k=>e=>setF({...f,[k]:e.target.value});
const pic=async e=>{const file=e.target.files[0];if(file)setF({...f,photo:await shrink(file)})};
const pub=async e=>{e.preventDefault();const t={...f,title:norm(f.title),uni:norm(f.uni),carrera:norm(f.carrera),course:norm(f.course),desc:norm(f.desc)};
if(t.title.length<4||!(+t.price>0)||!t.uni||!t.carrera||!t.course){setErr('Completa título, precio, universidad, carrera y curso.');return}
setErr('');setBusy(true);
try{const w=db.collection('products').add({...t,price:+t.price,ownerId:me.uid,ownerName:me.name,ownerInst:!!me.inst,status:'activo',createdAt:TS()});
await Promise.race([w,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);shout('Publicado: ya lo ven todos');setF({...empty,uni:t.uni,carrera:t.carrera})}
catch(x){setErr(x.message==='timeout'?'No se guardó: no hay conexión con la base de datos. Revisa que Firestore esté creado y sus reglas publicadas.':x.code==='permission-denied'?'Las reglas de Firestore no permiten publicar. Falta pegar y publicar las reglas.':'No se pudo publicar ('+(x.code||x.message)+').')}setBusy(false)};
const mine=items.filter(p=>p.ownerId===me.uid&&p.status!=='vendido');
const inp="w-full border border-linea rounded-xl p-3 bg-white";
const DL=({id,a})=><datalist id={id}>{a.map(x=><option key={x} value={x}/>)}</datalist>;
return <main className="max-w-6xl mx-auto px-4 py-8 grid lg:grid-cols-5 gap-8">
<form onSubmit={pub} className="lg:col-span-3 bg-white border border-linea rounded-3xl p-6 space-y-4">
<div><h1 className="font-display text-4xl">Publica en un minuto</h1><p className="text-ink/60 mt-1">En los campos con lista puedes elegir una opción o escribir la tuya.</p></div>
<label className="block"><span className="font-medium block mb-1">Título</span><input value={f.title} onChange={set('title')} placeholder="Ej: Física Universitaria, Sears Zemansky" className={inp}/></label>
<label className="block"><span className="font-medium block mb-1">Descripción (opcional)</span><textarea value={f.desc} onChange={set('desc')} rows="2" placeholder="Edición, detalles, qué incluye..." className={inp}/></label>
<div className="grid sm:grid-cols-2 gap-4"><label><span className="font-medium block mb-1">Universidad</span><input list="dl-u" value={f.uni} onChange={set('uni')} className={inp}/></label>
<label><span className="font-medium block mb-1">Carrera</span><input list="dl-c" value={f.carrera} onChange={set('carrera')} className={inp}/></label>
<label><span className="font-medium block mb-1">Curso</span><input list="dl-k" value={f.course} onChange={set('course')} placeholder="Ej: Cálculo 1" className={inp}/></label>
<label><span className="font-medium block mb-1">Ciclo</span><select value={f.ciclo} onChange={set('ciclo')} className={inp}>{['I','II','III','IV','V','VI','VII','VIII','IX','X'].map(c=><option key={c}>{c}</option>)}</select></label>
<label><span className="font-medium block mb-1">Categoría</span><select value={f.cat} onChange={set('cat')} className={inp}>{CATS.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}</select></label>
<label><span className="font-medium block mb-1">Precio (S/)</span><input type="number" min="1" value={f.price} onChange={set('price')} className={inp}/></label></div>
<DL id="dl-u" a={L.unis}/><DL id="dl-c" a={L.carr}/><DL id="dl-k" a={L.curs}/>
<div><span className="font-medium block mb-1">Estado</span><div className="grid grid-cols-3 gap-2">{['Excelente','Bueno','Desgastado'].map(s=><button type="button" key={s} onClick={()=>setF({...f,cond:s})} className={`border rounded-xl py-2.5 text-sm ${f.cond===s?'border-guinda bg-guinda/5 font-medium':'border-linea'}`}>{s}</button>)}</div></div>
<button type="button" onClick={()=>setF({...f,price:base})} className="text-sm text-guinda underline underline-offset-4">Usar precio sugerido: S/ {base}</button>
<div><span className="font-medium block mb-1">Foto (opcional)</span><input type="file" accept="image/*" onChange={pic} className="text-sm"/>{f.photo&&<img src={f.photo} alt="Vista previa" className="mt-2 h-28 rounded-xl"/>}</div>
{err&&<p className="text-sm text-guinda" role="alert">{err}</p>}
<button disabled={busy} className="w-full bg-guinda text-white rounded-full py-3.5 font-medium flex items-center justify-center gap-2 disabled:opacity-50"><I n="plus" s={18}/>{busy?'Publicando...':'Publicar ahora'}</button></form>
<aside className="lg:col-span-2"><h2 className="font-display text-2xl mb-3">Tus publicaciones activas</h2>
{mine.length?<div className="space-y-3">{mine.map(p=><button key={p.id} onClick={()=>open(p)} className="w-full text-left bg-white border border-linea rounded-2xl p-4 hover:border-guinda"><p className="font-medium">{p.title}</p><p className="text-sm text-ink/60">{p.cond} · {p.course} · <b>S/ {p.price}</b></p></button>)}<button onClick={()=>go('explore')} className="text-sm text-guinda underline underline-offset-4">Verlas en Explorar</button></div>
:<div className="border border-dashed border-linea rounded-2xl p-6 text-ink/60">Aún no publicaste nada. Completa el formulario y aparecerá aquí y en Explorar.</div>}</aside></main>}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
