{toast&&<div role="status" className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-ink text-white rounded-full px-5 py-3 text-sm z-50 flex items-center gap-2"><I n="check" s={16}/>{toast}</div>}
</div>}

function Modal({title,close,children}){return <div className="fixed inset-0 z-40 bg-ink/50 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={close}><div role="dialog" aria-modal="true" aria-label={title} onClick={e=>e.stopPropagation()} className="bg-white w-full sm:max-w-lg max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5"><div className="flex justify-between items-center mb-3"><span className="text-sm text-ink/60">{title}</span><button onClick={close} aria-label="Cerrar" className="w-9 h-9 rounded-full hover:bg-bruma flex items-center justify-center"><I n="x"/></button></div>{children}</div></div>}

function Gate({login}){return <main className="max-w-md mx-auto px-4 py-20 text-center"><span className="w-14 h-14 mx-auto rounded-full bg-guinda text-white flex items-center justify-center"><I n="lock" s={26}/></span><h1 className="font-display text-4xl mt-5">Únete a Relevo</h1><p className="text-ink/70 mt-2">Ingresa con tu cuenta de Google para publicar materiales y coordinar entregas en tu campus.</p><button onClick={login} className="mt-6 bg-guinda text-white rounded-full px-6 py-3 font-medium">Continuar con Google</button></main>}

function Sell({user,items,add,open,go}){
const empty={title:'',cat:'Libros',cond:'Bueno',price:'',course:CURSOS[0],ciclo:'I'};
const [f,setF]=useState(empty);const [err,setErr]=useState('');
const mine=items.filter(p=>p.owner===user.uid);
const sug={Libros:60,Maquetas:50,Calculadoras:60,Útiles:30,'Apuntes PDF':12};
const base=sug[f.cat]*({Excelente:1,Bueno:.8,Desgastado:.55}[f.cond]);
const set=k=>e=>setF({...f,[k]:e.target.value});
const pub=e=>{e.preventDefault();if(f.title.trim().length<4||!f.price){setErr('Escribe un título y un precio para publicar.');return}setErr('');
add({id:Date.now(),title:f.title.trim(),cat:f.cat,price:+f.price,uni:'UPC',carrera:'Ingeniería Industrial',course:f.course,cond:f.cond,seller:user.name.split(' ')[0],owner:user.uid,rating:5,sales:0,ciclo:f.ciclo});setF(empty)};
const inp="w-full border border-linea rounded-xl p-3 bg-white";
return <main className="max-w-6xl mx-auto px-4 py-8 grid lg:grid-cols-5 gap-8">
<form onSubmit={pub} className="lg:col-span-3 bg-white border border-linea rounded-3xl p-6 space-y-4">
<div><h1 className="font-display text-4xl">Publica en un minuto</h1><p className="text-ink/60 mt-1">Cuatro datos y tu material ya está en el campus.</p></div>
<label className="block"><span className="font-medium block mb-1">Título</span><input value={f.title} onChange={set('title')} placeholder="Ej: Física Universitaria, Sears Zemansky" className={inp}/></label>
<div className="grid sm:grid-cols-2 gap-4"><label><span className="font-medium block mb-1">Categoría</span><select value={f.cat} onChange={set('cat')} className={inp}>{CATS.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}</select></label>
<label><span className="font-medium block mb-1">Curso</span><select value={f.course} onChange={set('course')} className={inp}>{CURSOS.map(c=><option key={c}>{c}</option>)}</select></label></div>
<div><span className="font-medium block mb-1">Estado</span><div className="grid grid-cols-3 gap-2">{['Excelente','Bueno','Desgastado'].map(s=><button type="button" key={s} onClick={()=>setF({...f,cond:s})} className={`border rounded-xl py-2.5 text-sm ${f.cond===s?'border-guinda bg-guinda/5 font-medium':'border-linea'}`}>{s}</button>)}</div></div>
<div className="grid sm:grid-cols-2 gap-4"><label><span className="font-medium block mb-1">Ciclo</span><select value={f.ciclo} onChange={set('ciclo')} className={inp}>{['I','II','III','IV','V','VI','VII','VIII','IX','X'].map(c=><option key={c}>{c}</option>)}</select></label>
<label><span className="font-medium block mb-1">Precio (S/)</span><input type="number" min="1" value={f.price} onChange={set('price')} className={inp}/></label></div>
<button type="button" onClick={()=>setF({...f,price:Math.round(base)})} className="text-sm text-guinda underline underline-offset-4">Usar precio sugerido: S/ {Math.round(base)}</button>
{err&&<p className="text-sm text-guinda" role="alert">{err}</p>}
<button className="w-full bg-guinda text-white rounded-full py-3.5 font-medium flex items-center justify-center gap-2"><I n="plus" s={18}/>Publicar ahora</button></form>
<aside className="lg:col-span-2"><h2 className="font-display text-2xl mb-3">Tus publicaciones</h2>
{mine.length?<div className="space-y-3">{mine.map(p=><button key={p.id} onClick={()=>open(p)} className="w-full text-left bg-white border border-linea rounded-2xl p-4 hover:border-guinda"><p className="font-medium">{p.title}</p><p className="text-sm text-ink/60">{p.cond} · {p.course} · <b>S/ {p.price}</b></p></button>)}<button onClick={()=>go('explore')} className="text-sm text-guinda underline underline-offset-4">Verlas en Explorar</button></div>
:<div className="border border-dashed border-linea rounded-2xl p-6 text-ink/60">Aún no publicaste nada. Completa el formulario y aparecerá aquí.</div>}</aside></main>}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
